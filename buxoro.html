<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buxoro — agent visitlari</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Chap — filtr va ko'rsatkichlar; o'ng — xarita (ko'cha/sun'iy yo'ldosh), pastda — marshrut tartibidagi visitlar jadvali */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#18221f; --muted:#5d6b66; --line:#d9e0dd;
  --accent:#0b6e5f; --accent-soft:#e1f0ec; --warn:#b4540a; --bad:#b3261e; --good:#1d7a3a;
  --font-body:Arial,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body)}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font:700 19px/1.2 var(--font-body);margin:0}
.src{color:var(--muted);font-size:12px}
.app{display:grid;grid-template-columns:310px 1fr;gap:14px;padding:14px 20px}
aside{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
label.f{display:block;font-size:11px;color:var(--muted);margin:0 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
select,input[type=search]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.fields{display:flex;flex-direction:column;gap:11px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 0;font:600 13px var(--font-body);cursor:pointer;position:relative}
.days button .n{display:block;font-size:11px;color:var(--muted);font-weight:400}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.days button[aria-pressed="true"] .n{color:#ffffffcc}
.days button.low:not([aria-pressed="true"]) .n{color:var(--bad);font-weight:700}
.days button .sw{position:absolute;left:6px;top:6px;width:7px;height:7px;border-radius:50%}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.stat b{display:block;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.ok b{color:var(--good)} .stat.warn b{color:var(--warn)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.bad{background:#fbe3e1;color:var(--bad)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:7px 10px;font:600 13px var(--font-body);cursor:pointer;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--panel);color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
#map{height:64vh;min-height:430px;border-radius:8px;border:1px solid var(--line)}
.legend{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;line-height:1.7}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.num-ic{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font:700 11px Arial;border:2px solid #fff;box-shadow:0 0 0 1px #0004}
.num-ic.nof{border-color:#b3261e}
.leaflet-tooltip.km{background:#ffffffe6;border:1px solid #9aa;color:#123;font:700 11px Arial;padding:1px 5px;box-shadow:none}
.leaflet-tooltip.km:before{display:none}
.leaflet-tooltip.km.road{border-color:#0b6e5f;color:#0b6e5f}
.tablehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.tablehead h2{margin:0;font-size:16px}
.tablehead input{max-width:260px}
.tw{overflow:auto;max-height:430px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;font-size:12px;z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer} tbody tr:hover,tr.sel{background:var(--accent-soft)}
.nocoord{color:var(--warn)}
.empty{color:var(--muted);padding:18px;text-align:center}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:6px 0;font-size:12px}
.pop dt{color:var(--muted)} .pop dd{margin:0}
.pop a{color:var(--accent);font-weight:600}
@media (max-width:860px){.app{grid-template-columns:1fr;padding:10px 14px}#map{height:55vh}}
</style>
</head>

<header>
  <h1>Buxoro: agent visitlari</h1>
  <span class="src" id="src"></span>
</header>
<div class="app">
  <aside>
    <div class="card fields">

    <div class="card"><div class="stats" id="stats"></div></div>

      <button class="btn" id="road" type="button">Yo'l bo'yicha masofani hisoblash</button>
      <button class="btn sec" id="fit" type="button">Nuqtalarga moslash</button>

    </div>
  </aside>
  <main>
    <div id="map"></div>
    <div class="card">
      <div class="tablehead">
        <h2 id="tblTitle">Visitlar</h2>
        <input type="search" id="q" placeholder="Kod yoki nom bo'yicha qidirish">
      </div>
      <div class="tw">
        <table>
          <thead><tr><th class="num">№</th><th>Kun</th><th>Kod</th><th>Mijoz</th><th>Hafta</th><th class="num">Oldingisidan, km</th><th class="num">Yo'l bo'yicha, km</th><th class="num saldo-col">Saldo</th><th>Holat</th><th>Xarita</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

const key=()=>state.agent+'|'+state.day;
function fillVil(){const vs=[...new Set(ROWS.map(r=>r.vil))].sort();$('vil').innerHTML=vs.map(v=>`<option>${esc(v)}</option>`).join('');state.vil=vs[0];}
function fillAgents(){const m=new Map();ROWS.forEach(r=>{if(r.vil===state.vil&&!m.has(r.agent))m.set(r.agent,r);});const as=[...m.values()].sort((a,b)=>a.agent.localeCompare(b.agent));
  $('agent').innerHTML=as.map(a=>`<option value="${esc(a.agent)}">${esc(a.agent)}${a.loyiha?' — '+esc(a.loyiha):''}</option>`).join('');state.agent=as.length?as[0].agent:null;}
function drawDays(){
  const c={};DAYS.forEach(x=>c[x.d]=new Set());agentRows().forEach(r=>c[r.day].add(r.code));
  const tot=agentRows().length;
  const b=(d,lab,n,low,col)=>`<button type="button" data-d="${d}" aria-pressed="${state.day===d}" class="${low?'low':''}">${col?`<span class="sw" style="background:${col}"></span>`:''}${lab}<span class="n">${n}</span></button>`;
  $('days').innerHTML=b(0,'Hafta',tot,false,null)+DAYS.map(x=>b(x.d,x.s,c[x.d].size,c[x.d].size<15,DAYCOL[x.d])).join('');
  $('days').querySelectorAll('button').forEach(el=>el.onclick=()=>{state.day=+el.dataset.d;state.sel=null;render(true);});
}
function stats(rows){
  const coord=rows.filter(r=>r.lat!=null),debt=rows.filter(r=>r.saldo>0),nof=rows.filter(r=>r.faol==='N');
  const line=rows.reduce((s,r)=>s+(r._prev||0),0);
  const rd=road&&road.key===key()?road.total:null;
  const n=rows.length,low=state.day&&n<15;
  let t=[[n,state.day?"Do'konlar (kun)":'Visitlar (hafta)',low?'bad':''],[fmt(line,1)+' km',"To'g'ri chiziq bo'yicha",''],
    [rd!=null?fmt(rd,1)+' km':'—',"Yo'l bo'yicha",rd!=null?'ok':''],[rows.length-coord.length,'Koordinatasiz',rows.length-coord.length?'warn':'ok'],
    [debt.length+' ta','Qarzli · '+fmt(debt.reduce((s,r)=>s+r.saldo,0)),''],[nof.length,'Nofaol mijoz',nof.length?'bad':'ok']];
  if(NOSALDO)t=t.filter(x=>!String(x[1]).startsWith('Qarzli'));
  $('stats').innerHTML=t.map(x=>`<div class="stat ${x[2]}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')+(state.day?`<div style="grid-column:1/-1">${low?`<span class="pill bad">15 tadan kam: ${15-n} ta yetmaydi</span>`:`<span class="pill ok">15 talik shart bajarilgan</span>`}</div>`:'');
}
const links=r=>r.lat==null?'<span class="nocoord">koordinata yo\'q</span>':`<a href="https://www.google.com/maps?q=${r.lat},${r.lon}" target="_blank" rel="noopener">Google</a> · <a href="https://yandex.uz/maps/?pt=${r.lon},${r.lat}&z=17&l=map" target="_blank" rel="noopener">Yandex</a>`;
function popup(r){
  const ag=[...new Set(ROWS.filter(x=>x.code===r.code).map(x=>`${DAYS[x.day-1].s}: ${x.agent}`))];
  const rl=road&&road.key===key()&&r._n>1?road.legs[r._n-2]:null;
  return `<div class="pop"><b>${r._n?r._n+'. ':''}${esc(r.name)}</b><dl><dt>Kod</dt><dd>${esc(r.code)}</dd><dt>Kun</dt><dd>${DAYS[r.day-1].l}, ${WK[r.wk]||esc(r.wk)}</dd>
  ${r._prev!=null?`<dt>Oldingisidan</dt><dd>${fmt(r._prev,1)} km${rl!=null?' (yo\'l: '+fmt(rl,1)+' km)':''}</dd>`:''}
  ${NOSALDO?'':`<dt>Saldo</dt><dd>${fmt(r.saldo)}</dd>`}<dt>Holat</dt><dd>${r.faol==='N'?'<b style="color:#b3261e">Nofaol</b>':'Faol'}</dd><dt>Hudud</dt><dd>${esc(r.hudud||'—')}</dd>
  <dt>Agentlar</dt><dd>${ag.map(esc).join('<br>')}</dd></dl>${links(r)}</div>`;
}
function drawMap(fit){
  gOthers.clearLayers();gRoute.clearLayers();gKm.clearLayers();gPts.clearLayers();markers.clear();
  const rows=current().filter(r=>r.lat!=null);
  if($('others').checked&&state.day){
    const mine=new Set(rows.map(r=>r.code));
    ROWS.filter(r=>r.vil===state.vil&&r.day===state.day&&r.agent!==state.agent&&r.lat!=null&&!mine.has(r.code)).forEach(r=>
      L.circleMarker([r.lat,r.lon],{radius:4,color:'#667',weight:1,fillColor:'#99a',fillOpacity:.5}).bindTooltip(`${esc(r.name)}<br>${esc(r.agent)}`).addTo(gOthers));
  }
  const rd=road&&road.key===key()?road:null;
  DAYS.forEach(x=>{
    const dr=rows.filter(r=>r.day===x.d);if(!dr.length)return;
    if($('route').checked&&dr.length>1){
      if(rd&&rd.geo)L.polyline(rd.geo,{color:DAYCOL[x.d],weight:4,opacity:.75}).addTo(gRoute);
      else L.polyline(dr.map(r=>[r.lat,r.lon]),{color:DAYCOL[x.d],weight:2.5,opacity:.7,dashArray:'6 5'}).addTo(gRoute);
    }
    if($('kmlab').checked&&dr.length>1){
      for(let i=1;i<dr.length;i++){const a=dr[i-1],b=dr[i];
        const v=rd?rd.legs[i-1]:dr[i]._prev;
        L.tooltip({permanent:true,direction:'center',className:'km'+(rd?' road':'')}).setLatLng([(a.lat+b.lat)/2,(a.lon+b.lon)/2]).setContent(fmt(v,1)+' km').addTo(gKm);}
    }
  });
  rows.forEach(r=>{
    const big=!NOSALDO&&r.saldo>0,size=state.day?(big?24:20):(big?14:10);
    const m=state.day?L.marker([r.lat,r.lon],{icon:L.divIcon({className:'',html:`<div class="num-ic ${r.faol==='N'?'nof':''}" style="width:${size}px;height:${size}px;background:${DAYCOL[r.day]}">${r._n||''}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]})})
      :L.circleMarker([r.lat,r.lon],{radius:big?7:5,color:r.faol==='N'?'#b3261e':'#fff',weight:r.faol==='N'?2.5:1,fillColor:DAYCOL[r.day],fillOpacity:.95});
    m.bindPopup(()=>popup(r),{maxWidth:320});m.on('click',()=>{state.sel=r.code+'|'+r.day;highlight();});
    m.addTo(gPts);markers.set(r.code+'|'+r.day,m);
  });
  const lg=$('legend');if(lg){const ds=state.day?[DAYS[state.day-1]]:DAYS;lg.innerHTML=ds.map(x=>`<span><i style="background:${DAYCOL[x.d]}"></i>${x.l}</span>`).join('<br>')+`<br><span><i style="border:2px solid #b3261e"></i>nofaol</span>${NOSALDO?'':'<br><span>katta nuqta — qarzli</span>'}${state.day?'<br><span>raqam — marshrut tartibi</span>':''}`;}
  if(fit){const pts=rows.map(r=>[r.lat,r.lon]);if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:15});}
}
function table(rows){
  const q=$('q').value.trim().toLowerCase();
  const list=rows.filter(r=>!q||r.code.toLowerCase().includes(q)||String(r.name).toLowerCase().includes(q));
  const rd=road&&road.key===key()?road:null;
  $('tblTitle').textContent=`${state.agent||''} — ${state.day?DAYS[state.day-1].l:'butun hafta'} (${list.length})`;
  if(!list.length){$('tbody').innerHTML='<tr><td colspan="10" class="empty">Visit topilmadi</td></tr>';return;}
  $('tbody').innerHTML=list.map(r=>`<tr data-k="${esc(r.code)}|${r.day}" class="${state.sel===r.code+'|'+r.day?'sel':''}"><td class="num">${r._n||'—'}</td><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${DAYCOL[r.day]};margin-right:6px"></span>${DAYS[r.day-1].s}</td><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${WK[r.wk]||esc(r.wk)}</td><td class="num">${r._prev!=null?fmt(r._prev,1):''}</td><td class="num">${rd&&r._n>1?fmt(rd.legs[r._n-2],1):''}</td>${NOSALDO?'':`<td class="num">${fmt(r.saldo)}</td>`}<td>${r.faol==='N'?'<span class="pill bad">Nofaol</span>':'<span class="pill ok">Faol</span>'}</td><td>${links(r)}</td></tr>`).join('');
  $('tbody').querySelectorAll('tr[data-k]').forEach(tr=>tr.onclick=e=>{if(e.target.tagName==='A')return;state.sel=tr.dataset.k;highlight();const m=markers.get(state.sel);if(m){map.setView(m.getLatLng(),Math.max(map.getZoom(),15));m.openPopup();}});
}
function highlight(){document.querySelectorAll('#tbody tr').forEach(tr=>tr.classList.toggle('sel',tr.dataset.k===state.sel));const tr=document.querySelector(`#tbody tr[data-k="${CSS.escape(state.sel||'')}"]`);if(tr)tr.scrollIntoView({block:'nearest'});}
function render(fit){drawDays();const rows=current();stats(rows);table(rows);drawMap(fit);$('road').disabled=!state.day;}
async function roadCalc(){
  const rows=current().filter(r=>r.lat!=null);
  if(!state.day||rows.length<2)return;
  $('road').disabled=true;$('roadNote').textContent="Yo'l bo'yicha masofa hisoblanmoqda…";
  try{
    const legs=[],geo=[];
    for(let s=0;s<rows.length-1;s+=79){ // OSRM: bir so'rovda 80 nuqtagacha
      const part=rows.slice(s,s+80);
      const url='https://router.project-osrm.org/route/v1/driving/'+part.map(r=>r.lon+','+r.lat).join(';')+'?overview=full&geometries=geojson';
      const res=await fetch(url);if(!res.ok)throw new Error('HTTP '+res.status);
      const j=await res.json();if(j.code!=='Ok')throw new Error(j.code);
      j.routes[0].legs.forEach(l=>legs.push(l.distance/1000));
      j.routes[0].geometry.coordinates.forEach(c=>geo.push([c[1],c[0]]));
    }
    road={key:key(),legs,total:legs.reduce((a,b)=>a+b,0),geo};
    $('roadNote').textContent=`Yo'l bo'yicha: ${fmt(road.total,1)} km (OSRM, avtomobil yo'li; tartib — eng yaqin nuqta bo'yicha).`;
    render(false);
  }catch(e){$('roadNote').textContent="Yo'l bo'yicha hisoblab bo'lmadi ("+e.message+"). Internetni tekshiring yoki keyinroq urinib ko'ring. To'g'ri chiziq bo'yicha km ko'rsatilmoqda.";}
  $('road').disabled=!state.day;
}
$('vil').onchange=e=>{state.vil=e.target.value;fillAgents();state.day=1;state.sel=null;render(true);};
$('agent').onchange=e=>{state.agent=e.target.value;state.sel=null;render(true);};
['route','kmlab','others'].forEach(id=>$(id).onchange=()=>drawMap(false));
$('q').oninput=()=>table(current());
$('fit').onclick=()=>drawMap(true);
$('road').onclick=roadCalc;
$('src').textContent=SRC;
if(NOSALDO)document.querySelectorAll('.saldo-col').forEach(e=>e.remove());
if(BACK){const a=document.createElement('a');a.href=BACK;a.textContent='← Barcha viloyatlar';a.style.cssText='color:var(--accent);font-weight:600;font-size:13px';document.querySelector('header').prepend(a);}
fillVil();fillAgents();render(true);
})();
</script>
</body>
